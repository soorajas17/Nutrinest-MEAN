<style>
    .admin-topbar {
        background: #fff;
        border-bottom: 1px solid #eee;
        padding: 1.2rem 1.8rem;
    }

    .admin-topbar h3 {
        font-weight: 700;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #333;
    }

    .admin-topbar h3 i {
        color: #198754;
    }

    .action-bar {
        padding: 1.5rem 1.8rem 0;
    }

    .btn-add-recipe {
        border-radius: 50px;
        font-weight: 600;
        padding: 0.55rem 1.4rem;
        background: #198754;
        border: none;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .btn-add-recipe:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(25, 135, 84, 0.3);
    }

    .search-input {
        border-radius: 50px;
        padding: 0.55rem 1.3rem;
        border: 1px solid #ddd;
        transition: box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .search-input:focus {
        border-color: #198754;
        box-shadow: 0 0 0 3px rgba(25, 135, 84, 0.12);
    }

    .table-wrap {
        padding: 2rem;
    }

    .styled-table {
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08) !important;
        border: none !important;
    }

    .styled-table thead th {
        background: linear-gradient(135deg, #198754, #14532d) !important;
        color: #fff;
        font-weight: 600;
        border: none;
        padding: 1rem;
    }

    .styled-table tbody td {
        padding: 0.8rem 1rem;
        vertical-align: middle;
        border-color: #eee;
    }

    .styled-table tbody tr {
        transition: background 0.25s ease;
    }

    .styled-table tbody tr:hover {
        background: #f4f9f6;
    }

    .table-recipe-img {
        width: 70px;
        height: 70px;
        object-fit: cover;
        border-radius: 10px;
    }

    .btn-edit,
    .btn-delete-recipe {
        border-radius: 50%;
        width: 38px;
        height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease;
    }

    .btn-edit:hover {
        transform: scale(1.1);
        background: #198754;
        color: #fff;
    }

    .btn-delete-recipe:hover {
        transform: scale(1.1);
        background: #dc3545;
        color: #fff;
    }

    .empty-state {
        text-align: center;
        padding: 3rem;
    }

    .empty-state i {
        color: #dc3545;
        opacity: 0.6;
    }

    .empty-state p {
        color: #dc3545;
        font-weight: 600;
        margin: 1rem 0 0;
    }

    /* Modal */
    .recipe-modal .modal-content {
        border-radius: 16px;
        border: none;
        overflow: hidden;
    }

    .recipe-modal .modal-header {
        background: linear-gradient(135deg, #198754, #14532d) !important;
        border: none;
        padding: 1.3rem 1.8rem;
    }

    .recipe-modal .modal-title {
        font-weight: 700;
    }

    .recipe-modal .modal-body {
        padding: 1.8rem;
    }

    .recipe-modal .form-control,
    .recipe-modal .form-select {
        border-radius: 10px;
        padding: 0.6rem 0.9rem;
        border: 1px solid #dee2e6;
        transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .recipe-modal .form-control:focus,
    .recipe-modal .form-select:focus {
        border-color: #198754;
        box-shadow: 0 0 0 3px rgba(25, 135, 84, 0.12);
    }

    .recipe-modal .upload-label {
        color: #198754 !important;
        font-weight: 600;
        font-size: 0.9rem;
    }

    .recipe-modal .modal-footer {
        background: #f4f9f6 !important;
        border: none;
        padding: 1.2rem 1.8rem;
    }

    .recipe-modal .btn-cancel {
        border-radius: 50px;
        font-weight: 600;
        padding: 0.5rem 1.4rem;
    }

    .recipe-modal .btn-save,
    .recipe-modal .btn-update {
        border-radius: 50px;
        font-weight: 600;
        padding: 0.5rem 1.6rem;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .recipe-modal .btn-save:hover,
    .recipe-modal .btn-update:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
    }

    @media (max-width: 768px) {
        .action-bar {
            flex-direction: column;
            gap: 1rem;
            padding: 1.5rem 1.2rem 0;
        }

        .search-input {
            width: 100% !important;
            margin-right: 0 !important;
        }

        .table-wrap {
            padding: 1rem;
        }
    }
</style>

<app-admin-header></app-admin-header>

<div class="container-fluid p-0" style="overflow-x:hidden;">
    <div class="row">
        <div class="col-md-2">
            <app-admin-sidebar></app-admin-sidebar>
        </div>
        <div class="col-md-10 ps-0">
            <div class="row admin-topbar">
                <h3><i class="fa-solid fa-bars"></i>Recipe List</h3>
            </div>
            <div class="d-flex justify-content-between action-bar">
                <button type="button" class="btn btn-primary btn-add-recipe" data-bs-toggle="modal"
                    data-bs-target="#exampleModal">
                    <i class="fa-solid fa-plus me-2"></i>Add Recipe
                </button>
                <input class="form-control search-input w-25 me-3" type="text" placeholder="Search recipes...">
            </div>
            <div class="table-wrap table-responsive">
                @if(allRecipes.length>0){
                <table class="table styled-table">
                    <thead>
                        <tr>
                            <th class="text-center">SL No</th>
                            <th>Name</th>
                            <th class="text-center">Image</th>
                            <th>Cuisine</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (item of allRecipes; track $index) {
                        <tr>
                            <td class="text-center">{{$index+1}}</td>
                            <td>{{item.name}}</td>
                            <td class="text-center"><img class="table-recipe-img" [src]="item.image" alt=""></td>
                            <td>{{item.cuisine}}</td>
                            <td class="text-center">
                                <button (click)="editRecipe(item)" data-bs-toggle="modal" data-bs-target="#exampleModal"
                                    class="btn btn-outline-primary btn-edit"><i class="fa-solid fa-pen"></i></button>
                                <button type="button" (click)="deleteRecipe(item._id)"
                                    class="btn btn-outline-danger btn-delete-recipe ms-2"><i
                                        class="fa-solid fa-trash-can"></i></button>
                            </td>
                        </tr>
                        }
                    </tbody>
                </table>
                }@else {
                <div class="empty-state">
                    <i class="fa-solid fa-bowl-rice fa-2x"></i>
                    <p>No recipes yet...</p>
                </div>
                }
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade recipe-modal" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5 text-light" id="exampleModalLabel">Recipe Details</h1>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                    aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form [formGroup]="recipeForm">
                    <div class="container-fluid">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <input type="text" placeholder="Name of the recipe" name="name"
                                        formControlName="name" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <input type="text" placeholder="Preparation time" name="prepTimeMinutes"
                                        formControlName="prepTimeMinutes" class="form-control">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <input type="text" placeholder="Servings" name="servings" formControlName="servings"
                                        class="form-control">
                                </div>
                                <div class="mb-3">
                                    <input type="text" placeholder="Cooking time" name="cookTimeMinutes"
                                        formControlName="cookTimeMinutes" class="form-control">
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="mb-3">
                                <input class="form-control" type="text" placeholder="Calories" name="caloriesPerServing"
                                    formControlName="caloriesPerServing">
                            </div>
                            <div class="mb-3 w-100">
                                <select class="form-select w-100" formControlName="difficulty">
                                    <option value="" [defaultSelected]="true" disabled>Mode of cooking</option>
                                    <option value="Easy">Easy</option>
                                    <option value="Medium">Medium</option>
                                    <option value="Difficult">Difficult</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <select class="form-select w-100" formControlName="cuisine" name="cuisine">
                                    <option value="" [defaultSelected]="true" disabled>Cuisine Type</option>
                                    @for (item of cuisineType; track $index) {
                                    <option [value]="item">{{item}}</option>
                                    }
                                </select>
                            </div>
                            <div class="mb-3">
                                <input type="text" class="form-control" placeholder="Meal Type (Dinner,Lunch,Snack)"
                                    formControlName="mealType">
                            </div>
                            <div class="mb-3">
                                <textarea rows="3" class="form-control" placeholder="Ingredients (comma separated)"
                                    formControlName="ingredients"></textarea>
                            </div>
                            <div class="mb-3">
                                <textarea rows="3" class="form-control" placeholder="Instructions (comma separated)"
                                    formControlName="instructions"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="upload-label">Upload Image</label>
                                <input (change)="getFile($event)" type="file" class="form-control">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-warning btn-cancel" data-bs-dismiss="modal">Cancel</button>
                @if (!isEdit) {
                <button (click)="saveRecipe()" type="button" class="btn btn-success btn-save">Save</button>
                }@else {
                <button (click)="updateRecipe()" type="button" class="btn btn-primary btn-update"
                    data-bs-dismiss="modal">Update</button>
                }
            </div>
        </div>
    </div>
</div>
